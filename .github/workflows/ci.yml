name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ToDoApp.Api.Tests/ToDoApp.Api.Tests.csproj
      - run: dotnet build ToDoApp.Api.Tests/ToDoApp.Api.Tests.csproj --no-restore
      - run: dotnet test ToDoApp.Api.Tests/ToDoApp.Api.Tests.csproj --no-build
      
  publish-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/andreieuseb1u/todoapp-api:latest
            ghcr.io/andreieuseb1u/todoapp-api:${{ github.sha }}